server:
  port: 8080
spring:
  application:
    name: gestao-ocorrencias
  datasource:
    url: jdbc:h2:file:./data/ocorrencias;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    serialization:
      write-dates-as-timestamps: false
app:
  jwt:
    # Troque por uma chave aleatória longa em produção. Mínimo 32 bytes.
    secret: "Checkpoint6-SOA-WebServices-Secret-Key-2026-Use-At-Least-32-Bytes"
    expiration-ms: 86400000
